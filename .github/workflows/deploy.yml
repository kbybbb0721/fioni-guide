name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch site package
        run: |
          if [ -f fioni-guide-pages.zip ]; then
            echo 'using local package'
            cp fioni-guide-pages.zip /tmp/site.zip
          else
            echo 'downloading package'
            curl -fsSL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64)' -o /tmp/site.zip 'https://tmpfiles.org/dl/1793018347.86ad8ad6e5b279c3/wCAVVRs6xpQG/fioni-guide-pages.zip'
          fi
          unzip -t /tmp/site.zip > /dev/null
          rm -rf dist
          mkdir -p dist
          unzip -o /tmp/site.zip -d dist
          test -f dist/index.html
          ls dist | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  cache:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Store package in repository
        run: |
          if [ -f fioni-guide-pages.zip ]; then
            echo 'package already cached in repo'
            exit 0
          fi
          curl -fsSL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64)' -o fioni-guide-pages.zip 'https://tmpfiles.org/dl/1793018347.86ad8ad6e5b279c3/wCAVVRs6xpQG/fioni-guide-pages.zip'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fioni-guide-pages.zip
          git commit -m 'chore: cache site package [skip ci]'
          git push
