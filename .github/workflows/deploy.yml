name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch site package
        run: |
          if [ -f fioni-guide-pages.zip ]; then
            echo 'using local package'
            cp fioni-guide-pages.zip /tmp/site.zip
          else
            echo 'downloading package'
            curl -fsSL --retry 3 -o /tmp/site.zip 'https://tmpfiles.org/dl/wUA3VesnIcqb/fioni-guide-pages.zip'
          fi
          rm -rf dist
          mkdir -p dist
          unzip -o /tmp/site.zip -d dist
          test -f dist/index.html
          ls dist | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
